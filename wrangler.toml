name = "driveflin"
main = "src/index.ts"
compatibility_date = "2024-04-05"

# Deploys pelo Git não removem variáveis que existam só no painel da Cloudflare.
keep_vars = true

[assets]
directory = "public"

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY PONTE (temporário): sem os campos de instalação em [vars] e com keep_vars,
# os valores já preenchidos no painel da Cloudflare são preservados. Na primeira
# requisição o Worker os copia para o KV (DRIVEFLIN_CONFIG). Depois disto os campos
# de instalação voltam ao arquivo.
# ─────────────────────────────────────────────────────────────────────────────

# KV criado automaticamente no primeiro deploy (guarda as variáveis de instalação).
[[kv_namespaces]]
binding = "DRIVEFLIN_CONFIG"

[[d1_databases]]
binding = "DB"
database_name = "jellyfin_db_prod"

# Auto-scan Google Drive libraries every hour
[triggers]
crons = ["0 * * * *"]
