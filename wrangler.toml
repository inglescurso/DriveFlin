name = "driveflin"
main = "src/index.ts"
compatibility_date = "2024-04-05"

[assets]
directory = "public"

# ─────────────────────────────────────────────────────────────────────────────
# CAMPOS EXIBIDOS NO MOMENTO DA INSTALAÇÃO (Cloudflare Workers & Pages).
#
# IMPORTANTE: Estas variáveis aparecem como campos no painel da Cloudflare
# durante o primeiro deploy. Deixe os valores VAZIOS ("") para preencher
# depois em Settings > Variables and Secrets do seu Worker.
#
# ATENÇÃO: Em deploys subsequentes via GitHub Actions ou wrangler deploy,
# valores vazios SOBRESCREVEM as variáveis que você configurou no painel.
# Para evitar isso, remova este bloco [vars] após o primeiro deploy,
# ou use o botão "Sync fork" sem redeploy automático.
#
# Valores vazios NÃO quebram nada — o DriveFlin detecta a ausência e usa
# as credenciais de fábrica embutidas no código (funcionais para testes).
# ─────────────────────────────────────────────────────────────────────────────
[vars]
GDRIVE_CLIENT_ID     = ""
GDRIVE_CLIENT_SECRET = ""
GDRIVE_REFRESH_TOKEN = ""
GDRIVE_TEAM_DRIVE_ID = ""
TMDB_API_KEY         = ""
ADMIN_PASSWORD       = ""
RCLONE_PASS          = ""
RCLONE_SALT          = ""

[[d1_databases]]
binding = "DB"
database_name = "jellyfin_db_prod"

# Auto-scan Google Drive libraries every hour
[triggers]
crons = ["0 * * * *"]
