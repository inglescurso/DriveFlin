name = "driveflin"
main = "src/index.ts"
compatibility_date = "2024-04-05"

[assets]
directory = "public"

# As variáveis de ambiente (GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET, etc.)
# são configuradas pelo usuário no painel Cloudflare após o deploy, em
# Settings > Variables and Secrets. O bloco [vars] NÃO deve estar presente
# no wrangler.toml porque valores vazios sobrescrevem as variáveis já
# configuradas a cada deploy. Consulte o README.md para a lista completa.

[[d1_databases]]
binding = "DB"
database_name = "jellyfin_db_prod"

# Auto-scan Google Drive libraries every hour
[triggers]
crons = ["0 * * * *"]
