name = "driveflin"
main = "src/index.ts"
compatibility_date = "2024-04-05"

[assets]
directory = "public"

# ─────────────────────────────────────────────────────────────────────────────
# CAMPOS EXIBIDOS NO MOMENTO DA INSTALAÇÃO (Cloudflare Workers & Pages).
#
# Estes oito campos aparecem no painel da Cloudflare durante a instalação.
# Eles permanecem aqui para que um novo usuário consiga fazer o setup.
#
# Deploys de manutenção devem usar "npm run deploy", que executa Wrangler
# com --keep-vars e preserva os valores já preenchidos no painel. Não remova
# este bloco e não use "wrangler deploy" sem --keep-vars em uma instalação
# que tenha variáveis configuradas diretamente no painel.
# ─────────────────────────────────────────────────────────────────────────────
[vars]
GDRIVE_CLIENT_ID     = ""
GDRIVE_CLIENT_SECRET = ""
GDRIVE_REFRESH_TOKEN = ""
GDRIVE_TEAM_DRIVE_ID = ""
TMDB_API_KEY         = ""
ADMIN_PASSWORD       = ""
RCLONE_PASS          = ""
RCLONE_SALT          = ""

[[d1_databases]]
binding = "DB"
database_name = "jellyfin_db_prod"

# Auto-scan Google Drive libraries every hour
[triggers]
crons = ["0 * * * *"]
